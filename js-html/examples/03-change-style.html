<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change CSS</title><link rel="stylesheet" href="common.css">
  <style>
    #colorBox { padding: 2rem; text-align: center; background: #dce6ff; border-radius: 8px; }
    .dark { color: white; background: #172033 !important; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← All examples</a>
  <h1>Change CSS with JavaScript</h1>
  <div class="demo">
    <div id="colorBox">Watch my style change.</div>
    <p><button id="colorButton">Change color</button> <button id="themeButton">Toggle dark style</button></p>
  </div>
  <script>
    const colorBox = document.querySelector('#colorBox');

    document.querySelector('#colorButton').addEventListener('click', function () {
      colorBox.style.color = '#7a1d1d';
      colorBox.style.fontSize = '24px';
    });

    document.querySelector('#themeButton').addEventListener('click', function () {
      colorBox.classList.toggle('dark');
    });
  </script>
</body>
</html>
